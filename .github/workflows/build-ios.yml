name: Build iOS IPA

on:
  push:
    branches: [claude/bluetooth-chat-feasibility-c9qGx, main]
  pull_request:
    branches: [main]

jobs:
  build-ios:
    name: Build unsigned IPA
    runs-on: macos-15

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Install JS dependencies
        run: npm install

      - name: Bootstrap iOS Xcode project from template
        id: bootstrap
        run: |
          # Template ships inside react-native package; fall back to npm pack if missing
          TMPL="node_modules/react-native/template"
          if [ ! -d "$TMPL/ios" ]; then
            echo "Template not in node_modules — extracting via npm pack..."
            npm pack "react-native@0.76.5" --pack-destination /tmp/ --quiet
            mkdir -p /tmp/rn-tmpl
            tar xzf /tmp/react-native-0.76.5.tgz -C /tmp/rn-tmpl --strip-components=1 2>/dev/null || \
            tar xzf /tmp/react-native-0.76.5.tgz -C /tmp/rn-tmpl
            TMPL="/tmp/rn-tmpl/template"
          fi
          echo "Using template: $TMPL"
          ls "$TMPL/ios/"

          cp -r "$TMPL/ios/HelloWorld.xcodeproj" ios/BluetoothChat.xcodeproj

          # Rename scheme file
          find ios/BluetoothChat.xcodeproj -name "HelloWorld.xcscheme" \
            -exec sh -c 'mv "$1" "$(dirname "$1")/BluetoothChat.xcscheme"' _ {} \; 2>/dev/null || true

          # Replace HelloWorld only in known text files
          find ios/BluetoothChat.xcodeproj -type f \( -name "*.pbxproj" -o -name "*.xcscheme" \) \
            | xargs sed -i '' 's/HelloWorld/BluetoothChat/g'

          # AppDelegate
          cp "$TMPL/ios/HelloWorld/AppDelegate.swift" ios/BluetoothChat/ 2>/dev/null || \
          cp "$TMPL/ios/HelloWorld/AppDelegate.mm" ios/BluetoothChat/ 2>/dev/null || \
          { echo "ERROR: no AppDelegate found"; exit 1; }

          cp "$TMPL/ios/HelloWorld/LaunchScreen.storyboard" ios/BluetoothChat/ 2>/dev/null || true

          if [ -d "$TMPL/ios/HelloWorldTests" ]; then
            cp -r "$TMPL/ios/HelloWorldTests" ios/BluetoothChatTests
            find ios/BluetoothChatTests -type f \( -name "*.swift" -o -name "*.m" \) \
              | xargs sed -i '' 's/HelloWorld/BluetoothChat/g' 2>/dev/null || true
          fi

          echo "✅ Bootstrap complete"
          ls ios/BluetoothChat.xcodeproj/
          ls ios/BluetoothChat/
        continue-on-error: true

      - name: Capture bootstrap error to summary
        if: steps.bootstrap.outcome == 'failure'
        run: |
          echo "## ❌ iOS Bootstrap Failed" >> $GITHUB_STEP_SUMMARY
          echo "node_modules/react-native contents:" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          ls node_modules/react-native/ >> $GITHUB_STEP_SUMMARY 2>&1 || true
          echo '' >> $GITHUB_STEP_SUMMARY
          ls node_modules/react-native/template/ >> $GITHUB_STEP_SUMMARY 2>&1 || echo "No template dir" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          exit 1

      - name: Install CocoaPods
        working-directory: ios
        run: pod install

      - name: Build archive (no code signing)
        id: xcode_build
        run: |
          set -o pipefail
          xcodebuild \
            -workspace ios/BluetoothChat.xcworkspace \
            -scheme BluetoothChat \
            -configuration Release \
            -destination "generic/platform=iOS" \
            -archivePath "$RUNNER_TEMP/BluetoothChat.xcarchive" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            archive 2>&1 | tee /tmp/xbuild.log | grep -E '(error:|Build|Compiling|Linking|archive)'
        continue-on-error: true

      - name: Capture xcode error to summary
        if: steps.xcode_build.outcome == 'failure'
        run: |
          echo "## ❌ Xcode Build Error" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          grep -i 'error:' /tmp/xbuild.log | head -20 >> $GITHUB_STEP_SUMMARY || true
          echo '' >> $GITHUB_STEP_SUMMARY
          tail -40 /tmp/xbuild.log >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          exit 1

      - name: Package as IPA
        run: |
          APP=$(find "$RUNNER_TEMP/BluetoothChat.xcarchive" -name "*.app" | head -1)
          mkdir -p "$RUNNER_TEMP/Payload"
          cp -R "$APP" "$RUNNER_TEMP/Payload/"
          cd "$RUNNER_TEMP" && zip -qr BluetoothChat-unsigned.ipa Payload/

      - uses: actions/upload-artifact@v4
        with:
          name: bluetooth-chat-unsigned-ipa
          path: ${{ runner.temp }}/BluetoothChat-unsigned.ipa
          retention-days: 14
