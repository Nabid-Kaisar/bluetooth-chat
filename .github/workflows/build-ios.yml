name: Build iOS IPA

on:
  push:
    branches: [claude/bluetooth-chat-feasibility-c9qGx, main]
  pull_request:
    branches: [main]

jobs:
  build-ios:
    name: Build unsigned IPA
    runs-on: macos-15

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Install JS dependencies
        run: npm install

      # Bootstrap Xcode project using the CLI version that ships with RN 0.76
      - name: Bootstrap iOS Xcode project
        run: |
          npx @react-native-community/cli@14 init BluetoothChat \
            --directory /tmp/rn-scaffold \
            --skip-install \
            --version 0.76.5
          cp -r /tmp/rn-scaffold/ios/BluetoothChat.xcodeproj ios/
          for f in AppDelegate.swift AppDelegate.mm LaunchScreen.storyboard; do
            src="/tmp/rn-scaffold/ios/BluetoothChat/$f"
            [ -f "$src" ] && cp "$src" ios/BluetoothChat/ || true
          done
          [ -d /tmp/rn-scaffold/ios/BluetoothChatTests ] && \
            cp -r /tmp/rn-scaffold/ios/BluetoothChatTests ios/ || true

      - name: Install CocoaPods
        working-directory: ios
        run: pod install

      - name: Build archive (no code signing)
        run: |
          set -o pipefail
          xcodebuild \
            -workspace ios/BluetoothChat.xcworkspace \
            -scheme BluetoothChat \
            -configuration Release \
            -destination "generic/platform=iOS" \
            -archivePath "$RUNNER_TEMP/BluetoothChat.xcarchive" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            archive 2>&1 | tee /tmp/xcodebuild.log | grep -E '^(error:|warning:|Build|Compiling|Linking|Archive)' || \
            { tail -50 /tmp/xcodebuild.log; exit 1; }

      - name: Package as IPA
        run: |
          APP=$(find "$RUNNER_TEMP/BluetoothChat.xcarchive" -name "*.app" | head -1)
          mkdir -p "$RUNNER_TEMP/Payload"
          cp -R "$APP" "$RUNNER_TEMP/Payload/"
          cd "$RUNNER_TEMP" && zip -qr BluetoothChat-unsigned.ipa Payload/

      - uses: actions/upload-artifact@v4
        with:
          name: bluetooth-chat-unsigned-ipa
          path: ${{ runner.temp }}/BluetoothChat-unsigned.ipa
          retention-days: 14
