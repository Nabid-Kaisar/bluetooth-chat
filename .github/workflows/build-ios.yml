name: Build iOS IPA

on:
  push:
    branches:
      - claude/bluetooth-chat-feasibility-c9qGx
      - main
  pull_request:
    branches:
      - main

jobs:
  build-ios:
    name: Build unsigned IPA
    runs-on: macos-15

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 18
          cache: npm

      - name: Install JS dependencies
        run: npm install

      # react-native init generates the Xcode project we can't commit as binary via API.
      # Using the same app name so xcodeproj paths align with our Info.plist.
      - name: Bootstrap iOS Xcode project
        run: |
          npx react-native@0.76 init BluetoothChat \
            --directory /tmp/rn-scaffold \
            --skip-install

          cp -r /tmp/rn-scaffold/ios/BluetoothChat.xcodeproj ios/

          # Copy AppDelegate and LaunchScreen; keep our Info.plist (has BLE permissions)
          for f in AppDelegate.swift AppDelegate.mm LaunchScreen.storyboard; do
            [ -e "/tmp/rn-scaffold/ios/BluetoothChat/$f" ] && \
              cp "/tmp/rn-scaffold/ios/BluetoothChat/$f" "ios/BluetoothChat/" || true
          done

          # Test target is referenced in xcodeproj
          [ -d "/tmp/rn-scaffold/ios/BluetoothChatTests" ] && \
            cp -r /tmp/rn-scaffold/ios/BluetoothChatTests ios/ || true

      - name: Install CocoaPods
        working-directory: ios
        run: pod install

      - name: Install xcpretty
        run: gem install xcpretty --no-document

      - name: Build archive (no code signing)
        run: |
          set -o pipefail
          xcodebuild \
            -workspace ios/BluetoothChat.xcworkspace \
            -scheme BluetoothChat \
            -configuration Release \
            -destination "generic/platform=iOS" \
            -archivePath "$RUNNER_TEMP/BluetoothChat.xcarchive" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            archive | xcpretty

      # Package .app into Payload/*.ipa structure (standard IPA layout)
      - name: Package as IPA
        run: |
          APP=$(find "$RUNNER_TEMP/BluetoothChat.xcarchive" -name "*.app" | head -1)
          mkdir -p "$RUNNER_TEMP/Payload"
          cp -R "$APP" "$RUNNER_TEMP/Payload/"
          cd "$RUNNER_TEMP" && zip -qr BluetoothChat-unsigned.ipa Payload/

      - uses: actions/upload-artifact@v4
        with:
          name: bluetooth-chat-unsigned-ipa
          path: ${{ runner.temp }}/BluetoothChat-unsigned.ipa
          retention-days: 14
