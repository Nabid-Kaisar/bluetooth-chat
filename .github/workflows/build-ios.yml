name: Build iOS IPA

on:
  push:
    branches: [claude/bluetooth-chat-feasibility-c9qGx, main]
  pull_request:
    branches: [main]

jobs:
  build-ios:
    name: Build unsigned IPA
    runs-on: macos-15

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Install JS dependencies
        run: npm install

      # The react-native npm package ships its own template — no network needed.
      # Copy + rename HelloWorld → BluetoothChat so pod install can find the target.
      - name: Bootstrap iOS Xcode project from template
        run: |
          TMPL="node_modules/react-native/template"

          cp -r "$TMPL/ios/HelloWorld.xcodeproj" ios/BluetoothChat.xcodeproj

          # Rename the scheme file if one is bundled
          find ios/BluetoothChat.xcodeproj -name "HelloWorld.xcscheme" \
            -exec sh -c 'mv "$1" "$(dirname "$1")/BluetoothChat.xcscheme"' _ {} \; 2>/dev/null || true

          # Replace every HelloWorld reference inside the project files
          find ios/BluetoothChat.xcodeproj -type f \
            | xargs sed -i '' 's/HelloWorld/BluetoothChat/g'

          # Copy AppDelegate (Swift preferred, fall back to Obj-C++)
          cp "$TMPL/ios/HelloWorld/AppDelegate.swift" ios/BluetoothChat/ 2>/dev/null || \
          cp "$TMPL/ios/HelloWorld/AppDelegate.mm"   ios/BluetoothChat/ 2>/dev/null || true

          cp "$TMPL/ios/HelloWorld/LaunchScreen.storyboard" ios/BluetoothChat/ 2>/dev/null || true

          # Test target (referenced in xcodeproj; optional but avoids linker warnings)
          if [ -d "$TMPL/ios/HelloWorldTests" ]; then
            cp -r "$TMPL/ios/HelloWorldTests" ios/BluetoothChatTests
            find ios/BluetoothChatTests -type f \
              | xargs sed -i '' 's/HelloWorld/BluetoothChat/g'
          fi

          echo "✅ Xcode project bootstrapped"
          ls ios/BluetoothChat.xcodeproj/

      - name: Install CocoaPods
        working-directory: ios
        run: pod install

      - name: Build archive (no code signing)
        run: |
          set -o pipefail
          xcodebuild \
            -workspace ios/BluetoothChat.xcworkspace \
            -scheme BluetoothChat \
            -configuration Release \
            -destination "generic/platform=iOS" \
            -archivePath "$RUNNER_TEMP/BluetoothChat.xcarchive" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            archive 2>&1 | tee /tmp/xbuild.log | \
            grep -E '(error:|Build|Compiling|Linking|archive)' || \
            { echo "=== TAIL ===" && tail -60 /tmp/xbuild.log; exit 1; }

      - name: Package as IPA
        run: |
          APP=$(find "$RUNNER_TEMP/BluetoothChat.xcarchive" -name "*.app" | head -1)
          mkdir -p "$RUNNER_TEMP/Payload"
          cp -R "$APP" "$RUNNER_TEMP/Payload/"
          cd "$RUNNER_TEMP" && zip -qr BluetoothChat-unsigned.ipa Payload/

      - uses: actions/upload-artifact@v4
        with:
          name: bluetooth-chat-unsigned-ipa
          path: ${{ runner.temp }}/BluetoothChat-unsigned.ipa
          retention-days: 14
