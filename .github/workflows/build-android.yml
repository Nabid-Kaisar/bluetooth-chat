name: Build Android APK

on:
  push:
    branches: [claude/bluetooth-chat-feasibility-c9qGx, claude/bluetooth-chat-ci-fix-Xe9ph, main]
  pull_request:
    branches: [main]

jobs:
  build-apk:
    name: Build debug APK
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install JS dependencies
        run: npm install --no-audit --no-fund

      - uses: actions/setup-java@v4
        with:
          java-version: 17
          distribution: temurin

      - name: Write local.properties
        run: echo "sdk.dir=$ANDROID_HOME" > android/local.properties

      - name: Build debug APK
        id: gradle_build
        working-directory: android
        run: |
          set -o pipefail
          ./gradlew assembleDebug --no-daemon --stacktrace 2>&1 | tee /tmp/gradle.log
        continue-on-error: true

      - name: Capture build error to summary
        if: steps.gradle_build.outcome == 'failure'
        run: |
          echo "## Gradle Build Error" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          grep -E "(error:|FAILED|Exception|Unresolved|Cannot resolve|cannot find|> Task)" /tmp/gradle.log | tail -60 >> $GITHUB_STEP_SUMMARY || true
          echo '' >> $GITHUB_STEP_SUMMARY
          echo '--- last 80 lines ---' >> $GITHUB_STEP_SUMMARY
          tail -80 /tmp/gradle.log >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          exit 1

      - uses: actions/upload-artifact@v4
        if: steps.gradle_build.outcome == 'success'
        with:
          name: bluetooth-chat-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 14
