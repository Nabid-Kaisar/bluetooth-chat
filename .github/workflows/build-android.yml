name: Build Android APK

on:
  push:
    branches: [claude/bluetooth-chat-feasibility-c9qGx, main]
  pull_request:
    branches: [main]

jobs:
  build-apk:
    name: Build debug APK
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Install JS dependencies
        run: npm install

      - uses: actions/setup-java@v4
        with:
          java-version: 17
          distribution: temurin

      - name: Install Gradle 8.10.2
        run: |
          wget -q https://services.gradle.org/distributions/gradle-8.10.2-bin.zip -O /tmp/gradle.zip
          unzip -q /tmp/gradle.zip -d /opt
          echo "/opt/gradle-8.10.2/bin" >> $GITHUB_PATH

      - name: Write local.properties
        run: echo "sdk.dir=$ANDROID_HOME" > android/local.properties

      - name: Create placeholder launcher icons
        run: |
          ICON="iVBORw0KGgoAAAANSUhEUgAAAAEAAAABCAYAAAAfFcSJAAAAC0lEQVQI12NgAAIABQAABjkB6QAAAABJRU5ErkJggg=="
          for density in mdpi hdpi xhdpi xxhdpi xxxhdpi; do
            dir="android/app/src/main/res/mipmap-$density"
            mkdir -p "$dir"
            printf '%s' "$ICON" | base64 -d > "$dir/ic_launcher.png"
            cp "$dir/ic_launcher.png" "$dir/ic_launcher_round.png"
          done

      - name: Build debug APK
        id: gradle_build
        working-directory: android
        run: gradle assembleDebug --no-daemon --stacktrace 2>&1 | tee /tmp/gradle.log; exit ${PIPESTATUS[0]}
        continue-on-error: true

      - name: Capture build error to summary
        if: steps.gradle_build.outcome == 'failure'
        run: |
          echo "## ❌ Gradle Build Error" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          grep -E "(error:|FAILED|Exception|Unresolved|Cannot resolve|cannot find|> Task)" /tmp/gradle.log | tail -40 >> $GITHUB_STEP_SUMMARY || true
          echo '' >> $GITHUB_STEP_SUMMARY
          echo '--- last 50 lines ---' >> $GITHUB_STEP_SUMMARY
          tail -50 /tmp/gradle.log >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          exit 1

      - uses: actions/upload-artifact@v4
        if: steps.gradle_build.outcome == 'success'
        with:
          name: bluetooth-chat-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 14
