name: Build Android APK

on:
  push:
    branches:
      - claude/bluetooth-chat-feasibility-c9qGx
      - main
  pull_request:
    branches:
      - main

jobs:
  build-apk:
    name: Build debug APK
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Install JS dependencies
        run: npm install

      - uses: actions/setup-java@v4
        with:
          java-version: 17
          distribution: temurin

      # Installs a real Gradle binary — avoids needing gradle-wrapper.jar in the repo
      - name: Install Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: "8.10.2"

      - name: Write Android SDK path
        run: echo "sdk.dir=$ANDROID_HOME" > android/local.properties

      # Generates a proper gradlew + gradle-wrapper.jar in one step
      - name: Generate Gradle wrapper
        working-directory: android
        run: gradle wrapper --gradle-version=8.10.2

      # launcher icons are binary; create 1x1 px placeholders via base64 for CI
      - name: Create placeholder launcher icons
        run: |
          ICON="iVBORw0KGgoAAAANSUhEUgAAAAEAAAABCAYAAAAfFcSJAAAAC0lEQVQI12NgAAIABQAABjkB6QAAAABJRU5ErkJggg=="
          for density in mdpi hdpi xhdpi xxhdpi xxxhdpi; do
            dir="android/app/src/main/res/mipmap-$density"
            mkdir -p "$dir"
            printf '%s' "$ICON" | base64 -d > "$dir/ic_launcher.png"
            cp "$dir/ic_launcher.png" "$dir/ic_launcher_round.png"
          done

      - name: Build debug APK
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: bluetooth-chat-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 14
